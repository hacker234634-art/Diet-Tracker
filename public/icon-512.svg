<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#334155" stroke-width="8" />
  
  <!-- Outer Clock / Timer Circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#emeraldGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="800 280" />
  
  <!-- Subtle Interval Accent Dots -->
  <circle cx="256" cy="96" r="14" fill="#34d399" />
  <circle cx="416" cy="256" r="14" fill="#fbbf24" />
  <circle cx="256" cy="416" r="14" fill="#34d399" />
  <circle cx="96" cy="256" r="14" fill="#38bdf8" />
  
  <!-- Center Plate / Glow -->
  <circle cx="256" cy="256" r="110" fill="#1e293b" stroke="#334155" stroke-width="6" />
  
  <!-- Fork and Knife Stylized Icon -->
  <g transform="translate(176, 176) scale(0.625)" fill="none" stroke="#f8fafc" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fork -->
    <path d="M 50 40 L 50 120 C 50 145 75 160 90 160 L 90 220" />
    <path d="M 90 40 L 90 220" />
    <path d="M 130 40 L 130 120 C 130 145 105 160 90 160" />
    
    <!-- Knife -->
    <path d="M 170 40 C 170 40 190 60 190 120 C 190 150 170 160 170 220" fill="url(#amberGrad)" stroke="url(#amberGrad)" stroke-width="12" />
  </g>
  
  <!-- Timer Hands -->
  <line x1="256" y1="256" x2="310" y2="200" stroke="#34d399" stroke-width="14" stroke-linecap="round" />
  <line x1="256" y1="256" x2="256" y2="170" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="256" r="12" fill="#34d399" />
</svg>

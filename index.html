<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Meal Timing & Interval Tracker</title>
    <meta name="description" content="Personal meal timing, interval tracking, daily eating window calculations, and nutrition tracker." />
    
    <!-- PWA & Mobile Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    
    <!-- Apple / iOS Standalone App support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MealTracker" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Open Graph for Sharing -->
    <meta property="og:title" content="Meal Timing & Interval Tracker" />
    <meta property="og:description" content="Install and use on any device: iPhone, Android, iPad, Mac, Windows." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('PWA ServiceWorker registered:', reg.scope),
            (err) => console.log('PWA ServiceWorker registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
